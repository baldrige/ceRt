name: Conference reports

# Rebuilds the current sitting's conference reports and merges them into the
# gh-pages archive. Each term is fetched in its own job (separate runner IP) to
# keep sustained per-IP load -- and Akamai throttling -- down.
#
#   scheduled: Mondays, year-round, auto terms
#   manual:    optionally pass explicit `terms` (e.g. 24,25) to backfill

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      terms:
        description: "Terms to fetch, comma-separated (e.g. 24,25). Blank = current sitting (auto)."
        required: false
        default: ""
      min_conf_date:
        description: "Render conferences on/after (YYYY-MM-DD). Blank = auto from terms."
        required: false
        default: ""
      qp_max_new:
        description: "Max new QP petition PDFs to fetch this run (raise for a one-time backfill)."
        required: false
        default: "600"
      reuse_from_runs:
        description: "Comma-separated prior run IDs to pull cases-*.rds from, in ADDITION to this run's own terms. Use to resume an archive rebuild without re-fetching every term."
        required: false
        default: ""

permissions:
  contents: write
  actions: read      # gh run download, for reuse_from_runs

concurrency:
  group: conference-reports
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      min_conf: ${{ steps.plan.outputs.min_conf }}
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          use-public-rspm: true
      - id: plan
        env:
          INPUT_TERMS: ${{ inputs.terms }}
          INPUT_MIN: ${{ inputs.min_conf_date }}
        run: Rscript .github/scripts/plan_terms.R

  fetch:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      # Was true, which cancelled every other term the moment one failed and
      # threw away hours of good fetching on a ten-term archive rebuild. Safe to
      # relax now that (a) reuse_from_runs lets a re-dispatch fetch only the term
      # that failed, so the survivors' snapshots are worth keeping, and (b)
      # render_conferences.R refuses to render a snapshot set with a gap in it.
      # `publish` still requires every fetch to succeed -- a plain `if:` does not
      # waive the needs-success rule -- so this never publishes a partial set.
      fail-fast: false
      matrix:
        term: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: System dependencies (poppler + tesseract for pdftools/OCR)
        uses: ./.github/actions/system-deps
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: |
            any::gt
            any::gtExtras
            any::tidyverse
            any::httr2
            any::jsonlite
            any::pdftools
            any::htmltools
            any::nnet
      - name: Fetch OT ${{ matrix.term }}
        env:
          TERM_YEAR: ${{ matrix.term }}
          OUT_FILE: cases-${{ matrix.term }}.rds
        run: Rscript .github/scripts/fetch_term.R
      - uses: actions/upload-artifact@v4
        with:
          name: cases-${{ matrix.term }}
          path: cases-${{ matrix.term }}.rds
          # 30 days, not 5. These term snapshots are the expensive thing in the
          # whole pipeline -- a full fetch is ~3 h across ten runners at
          # SCOTUS_FETCH_RPS -- and they exist so a later render-only run can
          # skip it. At 5 days they expired before the next template bump wanted
          # them: the 2026-08-11 snapshots lapsed on 08-16, and the v20/v21
          # re-render on 08-19 had to re-fetch everything. Storage is free on a
          # public repo; a wasted 3 h is not.
          retention-days: 30

  # The long-held stragglers, fetched BY NAME rather than by widening the Term
  # window. A {T, T-1} range loses the cases a relist leaderboard is about --
  # 19-333 was relisted 12 times, 8 of them in a Term this matrix never loads.
  # The out-of-window live set has a median size of 8 and a measured max of 13,
  # against ~5,000 for a third Term. See R/pending_dockets.R.
  #
  # Runs in parallel with the Term matrix, on its own runner (own IP), and is
  # continue-on-error: a straggler lost to throttling must not cost a clean
  # ten-thousand-request Term fetch.
  fetch-pending:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Checkout published site (gh-pages) into ./site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
      - name: System dependencies (poppler + tesseract for pdftools/OCR)
        uses: ./.github/actions/system-deps
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: |
            any::gt
            any::gtExtras
            any::tidyverse
            any::httr2
            any::jsonlite
            any::pdftools
            any::htmltools
            any::nnet
      - name: Fetch out-of-window pending dockets
        env:
          SITE_DIR: site
          WINDOW_TERMS: ${{ join(fromJSON(needs.setup.outputs.matrix), ',') }}
          OUT_FILE: cases-pending.rds
        run: Rscript .github/scripts/fetch_pending.R
      - uses: actions/upload-artifact@v4
        # Absent when there was nothing to name, which is the normal state until
        # the render step has written a pending.json.
        if: hashFiles('cases-pending.rds') != ''
        with:
          name: cases-pending
          path: cases-pending.rds
          # 30 days, not 5. These term snapshots are the expensive thing in the
          # whole pipeline -- a full fetch is ~3 h across ten runners at
          # SCOTUS_FETCH_RPS -- and they exist so a later render-only run can
          # skip it. At 5 days they expired before the next template bump wanted
          # them: the 2026-08-11 snapshots lapsed on 08-16, and the v20/v21
          # re-render on 08-19 had to re-fetch everything. Storage is free on a
          # public repo; a wasted 3 h is not.
          retention-days: 30

  publish:
    # Waits for fetch-pending so its artifact is downloadable, but does NOT
    # require it to have succeeded -- `always()` is what waives the needs-success
    # rule (a plain `if:` does not). The Term matrix must still be green, exactly
    # as before: a missing Term silently under-counts relists, a missing
    # straggler merely omits one case and says so in the log.
    needs: [setup, fetch, fetch-pending]
    if: always() && needs.setup.result == 'success' && needs.fetch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v5
      - name: Checkout published site (gh-pages) into ./site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
      - name: System dependencies (poppler + tesseract for pdftools/OCR)
        uses: ./.github/actions/system-deps
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: |
            any::gt
            any::gtExtras
            any::tidyverse
            any::httr2
            any::jsonlite
            any::pdftools
            any::htmltools
            any::nnet
      - name: Download term snapshots (this run, plus any reuse runs)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE: ${{ inputs.reuse_from_runs }}
        run: |
          set -euo pipefail
          mkdir -p cases
          # Each run is staged in its OWN directory first. Downloading several
          # runs into one --dir collides whenever two of them carry the same
          # term, and which copy survives would be up to gh.
          i=0
          for r in "$GITHUB_RUN_ID" $(echo "$REUSE" | tr ', ' '\n' | sed '/^$/d'); do
            i=$((i + 1))
            mkdir -p "dl/$i"
            echo "downloading cases-* from run $r"
            gh run download "$r" --pattern 'cases-*' --dir "dl/$i" \
              || echo "  (nothing from run $r)"
          done
          # Flatten in staging order, so this run's freshly-fetched terms (i=1)
          # win over any stale copy of the same term in a reuse run. mv -n keeps
          # the first one moved.
          for d in $(ls -1d dl/*/ 2>/dev/null | sort -V); do
            find "$d" -name 'cases-*.rds' -exec mv -n {} cases/ \; 2>/dev/null || true
          done
          rm -rf dl
          echo "snapshots present:"; ls -1 cases/*.rds 2>/dev/null || echo "  none"
      - name: Render conferences
        env:
          SITE_DIR: site
          CASES_DIR: cases
          MIN_CONF_DATE: ${{ needs.setup.outputs.min_conf }}
          QP_MAX_NEW: ${{ inputs.qp_max_new || '600' }}
        run: Rscript .github/scripts/render_conferences.R
      - name: Render cert funnel
        # Never let a funnel failure block conference publishing.
        continue-on-error: true
        env:
          SITE_DIR: site
          CASES_DIR: cases
        run: Rscript .github/scripts/render_funnel.R
      - name: Render the counsel table
        # Never let a counsel failure block conference publishing.
        #
        # Reads only the committed archives and data/counsel_stats.json -- no
        # fetch, no cases/ -- so this normally rewrites an identical file and
        # publish_site.sh commits nothing. It is here anyway as the self-healing
        # path: if a change to the classifier leaves the committed stats stale,
        # the weekly run notices the fingerprint miss and republishes a correct
        # page rather than leaving a wrong one up until someone dispatches.
        continue-on-error: true
        env:
          SITE_DIR: site
        run: Rscript .github/scripts/render_counsel.R
      - name: Render argument navigator
        # Never let an argument-nav failure block conference publishing.
        continue-on-error: true
        env:
          SITE_DIR: site
          CASES_DIR: cases
          # Fetch newly-granted cases' Question-Presented PDFs (small text PDFs,
          # no OCR) so the cache stays current. Safe here: the publish runner is
          # fresh (it did no JSON-API fetching).
          QP_MAX_NEW: "200"
        run: Rscript .github/scripts/render_arguments.R
      - name: Commit and publish changes
        working-directory: site
        run: |
          ../.github/scripts/publish_site.sh "Conference refresh $(date -u +%F)"
