name: Enrich petition signals

# One-off / incremental: parse each paid, decided petition's PDF for the Rule 10
# signals (dissent below / circuit split) via R/petition_signals.R, one term per
# runner (fresh IPs, and the per-docket cache is resumable), then merge the terms
# into data-raw/petition_signals.json and commit it to main. The baseline
# cert-grant model reads this layer at train time.

on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Comma-separated terms (e.g. 2024 or 2017,2018). Blank = all 2017-2024. Also: 2025 (snapshot_25.rds) and refresh (snapshot_refresh.rds)."
        required: false
        default: ""
      max_new:
        description: "Max petitions to fetch per term this run."
        required: false
        default: "6000"

permissions:
  contents: write

concurrency:
  group: enrich-petitions
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        run: |
          terms="${{ inputs.terms }}"
          if [ -z "$terms" ]; then terms="2017,2018,2019,2020,2021,2022,2023,2024"; fi
          json=$(echo "$terms" | tr ',' '\n' | sed 's/[^0-9a-z]//g;/^$/d;s/^/"/;s/$/"/' | paste -sd, -)
          echo "matrix=[$json]" >> "$GITHUB_OUTPUT"
          echo "terms: [$json]"

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        term: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: System dependencies (poppler + tesseract for pdftools/OCR)
        uses: ./.github/actions/system-deps
      - uses: ./.github/actions/apt-sources
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 30
        with:
          use-public-rspm: true
      # Two attempts: a slow Ubuntu mirror (not a stalled one) outlasts the
      # 15-minute cap. See daily.yml.
      - name: Install R packages (cached)
        id: rdeps
        uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        timeout-minutes: 15
        with:
          packages: |
            any::gt
            any::gtExtras
            any::tidyverse
            any::httr2
            any::jsonlite
            any::pdftools
            any::htmltools
      - name: Let the first attempt's apt finish
        if: steps.rdeps.outcome == 'failure'
        timeout-minutes: 15
        run: |
          while pgrep -x 'apt-get|apt|dpkg' >/dev/null; do sleep 10; done
          sudo dpkg --configure -a
      - name: Install R packages (second attempt)
        if: steps.rdeps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: |
            any::gt
            any::gtExtras
            any::tidyverse
            any::httr2
            any::jsonlite
            any::pdftools
            any::htmltools
      # The conference run's on-site cache already holds the signals for every
      # petition it scored live; seeding from it spares those PDF fetches.
      - name: Seed from the on-site signal cache (gh-pages)
        run: |
          git fetch --depth=1 origin gh-pages
          git show FETCH_HEAD:conferences/petition_signals_cache.json > seed_conferences.json \
            || rm -f seed_conferences.json
      - name: Enrich OT ${{ matrix.term }}
        env:
          TERM_YEAR: ${{ matrix.term }}
          OUT: petition_signals_${{ matrix.term }}.json
          MAX_NEW: ${{ inputs.max_new || '6000' }}
          SEED_FILES: seed_conferences.json
        run: Rscript .github/scripts/enrich_petition_signals.R
      - uses: actions/upload-artifact@v4
        with:
          name: petition-signals-${{ matrix.term }}
          path: petition_signals_${{ matrix.term }}.json
          retention-days: 5

  combine:
    needs: fetch
    runs-on: ubuntu-latest
    # Must exceed the sum of this job's step caps (currently 75: setup-r 30 +
    # setup-r-dependencies 15, twice, with a 15-minute settle between), or the
    # job dies first and the step caps never fire -- which is strictly worse,
    # because a job-level cancel does not say WHICH step hung, while a step
    # timeout names it. 90 = 75 + a 15 min work allowance, ~5x the measured
    # maximum for any of these light jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/apt-sources
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 30
        with:
          use-public-rspm: true
      - name: Install R packages (cached)
        id: rdeps
        uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        timeout-minutes: 15
        with:
          packages: any::jsonlite
      - name: Let the first attempt's apt finish
        if: steps.rdeps.outcome == 'failure'
        timeout-minutes: 15
        run: |
          while pgrep -x 'apt-get|apt|dpkg' >/dev/null; do sleep 10; done
          sudo dpkg --configure -a
      - name: Install R packages (second attempt)
        if: steps.rdeps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: any::jsonlite
      - name: Download per-term caches
        uses: actions/download-artifact@v4
        with:
          path: caches
          pattern: petition-signals-*
          merge-multiple: true
      - name: Merge into data-raw/petition_signals.json
        env:
          IN_DIR: caches
          OUT: data-raw/petition_signals.json
        run: Rscript .github/scripts/combine_petition_signals.R
      - name: Commit enrichment layer to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-raw/petition_signals.json
          if git diff --cached --quiet; then
            echo "No change to petition_signals.json."
          else
            git commit -m "Enrich petition signals $(date -u +%F)"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              echo "push rejected; rebasing (attempt $i)"
              git pull --rebase origin main
              sleep $((RANDOM % 5 + 3))
            done
            echo "could not push after retries" >&2; exit 1
          fi
