name: Backfill Question Presented (historical)

# One-off / occasional: fetch the petition PDFs for the historical argued grants
# (arg_refresh.rds) from a fresh runner IP, extract their Question Presented, and
# fold them into the shared conference QP cache on gh-pages. The argument
# navigator reads that cache read-only, so the older cases then show a QP too.

on:
  workflow_dispatch:
    inputs:
      qp_max_new:
        description: "Max petition PDFs to fetch this run."
        required: false
        default: "1000"

permissions:
  contents: write

concurrency:
  group: qp-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v5
      - name: Checkout published site (gh-pages) into ./site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
      - name: System dependencies (poppler + tesseract for pdftools/OCR)
        uses: ./.github/actions/system-deps
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: |
            any::tidyverse
            any::pdftools
            any::jsonlite
      - name: Backfill historical QPs into the cache
        env:
          QP_CACHE: site/conferences/qp_cache.json
          QP_MAX_NEW: ${{ inputs.qp_max_new || '1000' }}
        run: Rscript .github/scripts/backfill_qp.R
      - name: Commit updated cache
        working-directory: site
        run: |
          ../.github/scripts/publish_site.sh "Backfill historical Question Presented $(date -u +%F)" \
            conferences/qp_cache.json
