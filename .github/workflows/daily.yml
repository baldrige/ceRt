name: Daily SCOTUS dashboards

# Fetches the current term three times a day and republishes the daily petitions
# dashboards to the gh-pages branch (served by GitHub Pages). The conference
# archive already on gh-pages is preserved untouched.
#
# Prerequisite (one-time): a gh-pages branch must exist (see the bootstrap notes
# in the setup instructions), and Pages must be set to deploy from gh-pages.

on:
  schedule:
    # Cron is UTC and does NOT observe US daylight saving, so the ET-anchored
    # runs below are set for EDT (UTC-4); during standard time (Nov-Mar) they
    # land one hour earlier in ET.
    - cron: "30 0 * * *"   # ~00:30 UTC, shortly after the ~00:05 UTC JSON re-export
    - cron: "0 18 * * *"   # 2pm ET (EDT); 1pm ET during standard time
    - cron: "0 22 * * *"   # 6pm ET (EDT); 5pm ET during standard time
  workflow_dispatch:
    inputs:
      full_term:
        description: "Fetch the WHOLE term and re-render every dashboard date, not just the trailing fetch window. Use after a template or palette change. NOTE: not a re-skin -- forecasts recompute against the current model and dispositions update."
        required: false
        default: "false"
      min_date:
        description: "With full_term, render only dates on/after this (YYYY-MM-DD). Blank = every date in the term."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-dashboards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Deliberately loose, and a backstop rather than the real guard. An ordinary
    # daily runs 4-5 min (median 4.8, max 12.2 over the last 38 successful jobs),
    # but the full_term dispatch re-fetches an entire term at SCOTUS_FETCH_RPS and
    # re-renders every date in it -- that path has never run here, so its true
    # ceiling is unmeasured and a tight cap would kill the first legitimate one.
    #
    # A conditional (45 for a scheduled run, 240 for full_term) would bound the
    # common case far better. It is not used because it cannot be tested before
    # it ships: an expression that fails to evaluate is an "Invalid workflow
    # file" that breaks the daily entirely, discovered at the next scheduled run.
    # The step timeouts below are what actually catch the observed failure.
    timeout-minutes: 180
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v5

      - name: Checkout published site (gh-pages) into ./site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: System dependencies (poppler + tesseract for pdftools/OCR)
        uses: ./.github/actions/system-deps

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          use-public-rspm: true

      - name: Install R packages (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: |
            any::gt
            any::gtExtras
            any::tidyverse
            any::httr2
            any::jsonlite
            any::pdftools
            any::htmltools
            any::openssl
            any::jose

      - name: Build dashboards into ./site
        env:
          SITE_DIR: site
          TERM_YEAR: "26"
          DASH_FULL_TERM: ${{ inputs.full_term }}
          DASH_MIN_DATE: ${{ inputs.min_date }}
          # Read-only GA4 access for the landing page's "Most-Read Cases" panel.
          # Optional: if these are unset the panel is omitted and the build is
          # otherwise unaffected (see R/site_analytics.R).
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: Rscript .github/scripts/build_dashboards.R

      - name: Commit and publish changes
        working-directory: site
        run: ../.github/scripts/publish_site.sh "Daily dashboard refresh $(date -u +%F)"
