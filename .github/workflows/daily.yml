name: Daily SCOTUS dashboards

# Fetches the current term three times a day and republishes the daily petitions
# dashboards to the gh-pages branch (served by GitHub Pages). The conference
# archive already on gh-pages is preserved untouched.
#
# Prerequisite (one-time): a gh-pages branch must exist (see the bootstrap notes
# in the setup instructions), and Pages must be set to deploy from gh-pages.

on:
  schedule:
    # Cron is UTC and does NOT observe US daylight saving, so the ET-anchored
    # runs below are set for EDT (UTC-4); during standard time (Nov-Mar) they
    # land one hour earlier in ET.
    #
    # The two ET-anchored runs moved 87 minutes EARLIER on 2026-08-27, and the
    # nominal times are no longer the point -- the ACTUAL fire times are. GitHub
    # dispatches `schedule` on a best-effort queue and sheds it under load, worst
    # at the top of the hour. Measured drift over 08-10..08-27: the :00 crons
    # landed 16-30 min late on a good day, and on 08-26/27 three of six slots
    # were dropped outright while the survivors ran 1h48 and 2h20 late, one of
    # them detaching from its slot entirely (a 10:03 UTC run matching no cron).
    #
    # Every slot now sits on a :03/:33 minute mark, off the contended hour (and
    # off :30, which is the next most crowded). Whether it also wants the 87
    # minutes depends on which side of its target it can afford to miss:
    #
    #   00:33 UTC  Bounded BELOW, by the ~00:05 UTC JSON re-export -- it has to
    #              run AFTER that or it reads yesterday's export. Drift pushes it
    #              later, which is harmless here, so this slot wants no head
    #              start at all: it wants to sit just past 00:05 and let the
    #              queue take it from there. It briefly ran at 23:03 (87 min
    #              early), which put the NOMINAL time an hour BEFORE the export
    #              and made correctness depend on the drift persisting. Fixed.
    #   16:33 UTC  12:33pm EDT -- BEFORE the 2pm ET GA4 window flip, so this is
    #              no longer the run that picks up new analytics.
    #   20:33 UTC  4:33pm EDT -- after the flip, so this is the GA-bearing run
    #              for the landing page's Most-Read Cases panel. Bounded BELOW
    #              too (by the flip), and 87 min early still clears it.
    - cron: "33 0 * * *"    # ~00:33 UTC, shortly after the ~00:05 UTC JSON re-export
    - cron: "33 16 * * *"   # was "0 18": 12:33pm ET (EDT); 11:33am ET during standard time
    - cron: "33 20 * * *"   # was "0 22": 4:33pm ET (EDT); 3:33pm ET during standard time
    #   14:03 UTC Mon  10:03am EDT, after the 9:30 order list on a Monday. The
    #              order lists (R/orders_list.R) are the one thing with a known
    #              posting time that no other slot is near; watch-court.yml
    #              should catch it too, but a fixed slot is the floor.
    - cron: "3 14 * * 1"
  workflow_dispatch:
    inputs:
      full_term:
        description: "Fetch the WHOLE term and re-render every dashboard date, not just the trailing fetch window. Use after a template or palette change. NOTE: not a re-skin -- forecasts recompute against the current model and dispositions update."
        required: false
        default: "false"
      min_date:
        description: "With full_term, render only dates on/after this (YYYY-MM-DD). Blank = every date in the term."
        required: false
        default: ""
      orders_terms:
        description: "Order lists: two-digit Terms to read the Court's listing for (e.g. 23,24). Blank = current and prior. Use to backfill orders/ for older Terms."
        required: false
        default: ""
      orders_max_new:
        description: "Order lists: cap on documents to download and parse this run. A Term is ~110 documents."
        required: false
        default: "250"

permissions:
  contents: write

concurrency:
  group: daily-dashboards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Deliberately loose, and a backstop rather than the real guard. An ordinary
    # daily runs 4-5 min (median 4.8, max 12.2 over the last 38 successful jobs),
    # but the full_term dispatch re-fetches an entire term at SCOTUS_FETCH_RPS and
    # re-renders every date in it -- that path has never run here, so its true
    # ceiling is unmeasured and a tight cap would kill the first legitimate one.
    #
    # A conditional (45 for a scheduled run, 240 for full_term) would bound the
    # common case far better. It is not used because it cannot be tested before
    # it ships: an expression that fails to evaluate is an "Invalid workflow
    # file" that breaks the daily entirely, discovered at the next scheduled run.
    # The step timeouts below are what actually catch the observed failure.
    timeout-minutes: 180
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v5

      - name: Checkout published site (gh-pages) into ./site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: System dependencies (poppler + tesseract for pdftools/OCR)
        uses: ./.github/actions/system-deps

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        # 30, raised from 15 on 2026-08-19. This step is not a thin wrapper: it
        # DOWNLOADS R (`##[group]Downloading R` -> /opt/R/4.6.1), so it depends
        # on a CDN as much as apt does. On a day of site-wide egress trouble it
        # took 6m52s on a run that passed and hit the 15-minute wall twice on
        # runs that did not. 15 was sized off a 33s median and a 341s worst
        # success -- which looked like 2.6x headroom and was 2.2x the only
        # success measured that day. 30 is ~4x it, and still a fraction of the
        # hours this used to hang for before it was bounded at all.
        #
        # setup-r-dependencies deliberately stays at 15: it has never come close,
        # and loosening a cap that is not failing only makes the next hang longer.
        timeout-minutes: 30
        with:
          use-public-rspm: true

      - name: Install R packages (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: |
            any::gt
            any::gtExtras
            any::tidyverse
            any::httr2
            any::jsonlite
            any::pdftools
            any::htmltools
            any::openssl
            any::jose

      - name: Build dashboards into ./site
        env:
          SITE_DIR: site
          TERM_YEAR: "26"
          DASH_FULL_TERM: ${{ inputs.full_term }}
          DASH_MIN_DATE: ${{ inputs.min_date }}
          # The Court's order lists (R/orders_list.R): which Terms' listings to
          # read, and how many new documents to pull. Blank/default on a cron.
          ORDERS_TERMS: ${{ inputs.orders_terms }}
          ORDERS_MAX_NEW: ${{ inputs.orders_max_new || '250' }}
          # Read-only GA4 access for the landing page's "Most-Read Cases" panel.
          # Optional: if these are unset the panel is omitted and the build is
          # otherwise unaffected (see R/site_analytics.R).
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: Rscript .github/scripts/build_dashboards.R

      - name: Commit and publish changes
        working-directory: site
        run: ../.github/scripts/publish_site.sh "Daily dashboard refresh $(date -u +%F)"
