name: Watch the Court

# Poll supremecourt.gov's Hermes transfer feed every fifteen minutes and
# dispatch the daily when it changes, so an afternoon opinion or a Monday
# order list reaches the site within minutes rather than at the next fixed
# cron. See .github/scripts/court_watch.py and docs/data-sources.md.
#
# It runs as a CHAIN, not a cron. GitHub honoured 16 of this workflow's first
# 177 fifteen-minute cron slots (5-7 Sep 2026), a median of 126 minutes apart,
# so each run now stays up for just under six hours, polling from inside the
# job, and dispatches the next run before it exits. The cron below is the
# restart floor: if the chain breaks, the next honoured slot starts a new
# run; if a run is already in progress, a cron-started run exits at once.
# The concurrency group keeps it to one active run.
#
# State (the last fingerprint seen) rides in the Actions cache: each run saves
# its own key and restores the newest one with the prefix, which is the one
# stateless-repo store that needs no commit and no secret. The script also
# writes it after every poll, so a run cut short loses nothing.

on:
  schedule:
    # Off the contended :00/:15/:30/:45 marks, for the reason daily.yml gives.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide, print, but do not dispatch anything."
        required: false
        default: "false"
      loop_min:
        description: "Minutes to keep polling inside this run (0 = one poll). Default just under GitHub's six-hour job cap."
        required: false
        default: "345"

permissions:
  actions: write
  contents: read

concurrency:
  group: watch-court
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # The job cap is GitHub's maximum; the polling step's cap leaves the save
    # step time to run, and the two step caps (3 + 350) stay under it.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts/court_watch.py
          sparse-checkout-cone-mode: false
      - name: Restore the last fingerprint
        uses: actions/cache/restore@v4
        timeout-minutes: 3
        with:
          path: .hermes_state
          key: hermes-state-${{ github.run_id }}
          restore-keys: hermes-state-
      - name: Watch
        timeout-minutes: 350
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
          WATCH_LOOP_MIN: ${{ inputs.loop_min || '345' }}
          POLL_SEC: "900"
          RECHAIN: "1"
        run: python3 .github/scripts/court_watch.py
      - name: Save the fingerprint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hermes_state
          key: hermes-state-${{ github.run_id }}
