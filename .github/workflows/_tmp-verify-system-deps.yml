# TEMPORARY. Proves the system-deps composite action resolves and installs on a
# real runner. Deleted before this branch merges -- do not build on it.
name: TEMP verify system-deps action

on:
  push:
    branches: [harden-apt-system-deps]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies (poppler + tesseract for pdftools/OCR)
        uses: ./.github/actions/system-deps

      - name: Assert the packages the pipeline actually needs are present
        run: |
          set -euo pipefail
          for p in libpoppler-cpp-dev libtesseract-dev tesseract-ocr libcurl4-openssl-dev; do
            dpkg -s "$p" >/dev/null 2>&1 || { echo "::error::$p not installed"; exit 1; }
            echo "ok: $p"
          done
          pkg-config --modversion poppler-cpp
          tesseract --version | head -1

      - name: Assert a custom packages input is honoured
        uses: ./.github/actions/system-deps
        with:
          packages: jq

      - run: jq --version
