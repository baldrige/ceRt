name: Backfill Question Presented (paid or IFP petitions)

# Incremental: extract the Question Presented from every petition's PDF, one
# term per runner (fresh IPs spread supremecourt.gov's PDF rate limit), then
# fold all terms into the shared conference QP cache on gh-pages -- which
# render_dockets_for() and the questions index (R/qp_index.R) read, so docket
# pages and /questions/ then cover the historical denied cases too. A later
# docket re-render embeds them into the pages.
#
# Resumable: a petition that yielded a question is in the cache, one that
# yielded none is in the ledger beside it (conferences/qp_tried.json), and a
# run reads neither again. Re-dispatch until every Term's summary line says
# "0 still to read". See enrich_qp.R for why the ledger exists.

on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Comma-separated terms. Blank = 2017-2024 (snapshots on disk)."
        required: false
        default: ""
      max_new:
        description: "Max petition PDFs to fetch per term this run."
        required: false
        default: "3000"
      types:
        description: "Petition types: paid, ifp, or paid,ifp. A run stops itself at 100 minutes whatever max_new says, and the next dispatch resumes."
        required: false
        default: "paid"

permissions:
  contents: write

concurrency:
  group: qp-backfill-all
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        run: |
          terms="${{ inputs.terms }}"
          if [ -z "$terms" ]; then terms="2017,2018,2019,2020,2021,2022,2023,2024"; fi
          json=$(echo "$terms" | tr ',' '\n' | sed 's/[^0-9]//g;/^$/d;s/^/"/;s/$/"/' | paste -sd, -)
          echo "matrix=[$json]" >> "$GITHUB_OUTPUT"
          echo "terms: [$json]"

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        term: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v5
      - name: Checkout published site (gh-pages) into ./site (for the seed cache)
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
      - name: System dependencies (poppler + tesseract for pdftools/OCR)
        uses: ./.github/actions/system-deps
      - uses: ./.github/actions/apt-sources
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 30
        with:
          use-public-rspm: true
      # Two attempts: a slow Ubuntu mirror (not a stalled one) outlasts the
      # 15-minute cap. See daily.yml.
      - name: Install R packages (cached)
        id: rdeps
        uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        timeout-minutes: 15
        with:
          packages: |
            any::gt
            any::gtExtras
            any::tidyverse
            any::httr2
            any::jsonlite
            any::pdftools
            any::htmltools
      - name: Stop the first attempt's apt
        if: steps.rdeps.outcome == 'failure'
        timeout-minutes: 15
        uses: ./.github/actions/apt-settle
      - name: Install R packages (second attempt)
        if: steps.rdeps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: |
            any::gt
            any::gtExtras
            any::tidyverse
            any::httr2
            any::jsonlite
            any::pdftools
            any::htmltools
      # The script stops itself at BUDGET_MIN and writes what it has. Most
      # historical IFP petitions carry the Court's own text layer (~1 s each,
      # paced); the ~1 in 20 that is a bare scan is OCRed at ~20 s. The step
      # limit is the backstop: the cache and the ledger are checkpointed every
      # 100 petitions, and the upload and the combine job below run whether or
      # not this step finished.
      - name: Extract QP for OT ${{ matrix.term }}
        # 120: with setup-r (30) and its dependencies (15) that is 165, inside the
        # job's 180 -- lint_workflows.py enforces the margin -- and it leaves the
        # upload time to run.
        timeout-minutes: 120
        env:
          TERM_YEAR: ${{ matrix.term }}
          OUT: qp_${{ matrix.term }}.json
          MAX_NEW: ${{ inputs.max_new || '3000' }}
          CASE_TYPES: ${{ inputs.types || 'paid' }}
          SEED: site/conferences/qp_cache.json
          TRIED_OUT: qp_tried_${{ matrix.term }}.json
          TRIED_SEED: site/conferences/qp_tried.json
          BUDGET_MIN: "100"
        run: Rscript .github/scripts/enrich_qp.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qp-${{ matrix.term }}
          path: |
            qp_${{ matrix.term }}.json
            qp_tried_${{ matrix.term }}.json
          retention-days: 5

  combine:
    needs: fetch
    # Merge whatever terms produced, including a term stopped by its time limit.
    if: always()
    runs-on: ubuntu-latest
    # Must exceed the sum of this job's step caps (currently 75: setup-r 30 +
    # setup-r-dependencies 15, twice, with a 15-minute settle between), or the
    # job dies first and the step caps never fire -- which is strictly worse,
    # because a job-level cancel does not say WHICH step hung, while a step
    # timeout names it. 90 = 75 + a 15 min work allowance, ~5x the measured
    # maximum for any of these light jobs.
    timeout-minutes: 90
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v5
      - name: Checkout published site (gh-pages) into ./site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
      - uses: ./.github/actions/apt-sources
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 30
        with:
          use-public-rspm: true
      - name: Install R packages (cached)
        id: rdeps
        uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        timeout-minutes: 15
        with:
          packages: any::jsonlite
      - name: Stop the first attempt's apt
        if: steps.rdeps.outcome == 'failure'
        timeout-minutes: 15
        uses: ./.github/actions/apt-settle
      - name: Install R packages (second attempt)
        if: steps.rdeps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: any::jsonlite
      - name: Download per-term QP caches
        uses: actions/download-artifact@v4
        with:
          path: caches
          pattern: qp-*
          merge-multiple: true
      - name: Merge into the shared conference QP cache
        env:
          IN_DIR: caches
          OUT: site/conferences/qp_cache.json
          TRIED_OUT: site/conferences/qp_tried.json
        run: Rscript .github/scripts/combine_qp.R
      - name: Commit updated cache to gh-pages
        working-directory: site
        run: |
          ../.github/scripts/publish_site.sh "Backfill QP for ${{ inputs.types || 'paid' }} petitions $(date -u +%F)" \
            conferences/qp_cache.json conferences/qp_tried.json
