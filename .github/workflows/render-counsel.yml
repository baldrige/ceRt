name: Render the Counsel Table

# Re-render counsel/index.html and counsel/amicus.html on demand.
#
# Unlike render-funnel.yml this needs nothing from a prior run and nothing from
# the network: every number on the page comes from the committed term archives
# via data/counsel_stats.json. There is no artifact to expire and no fetch to
# accidentally trigger, so this is always safe to dispatch.
#
# If the committed stats are stale against the code, render_counsel.R recomputes
# in-process (~4 min) so the published page is right, and says so loudly in the
# log. Refresh the committed copy with:
#   Rscript .github/scripts/make_counsel_stats.R
#
# Publishes ONLY counsel/index.html, counsel/amicus.html and counsel/terms/. The
# amicus page follows the same contract (data/amicus_stats.json,
# make_amicus_stats.R). counsel/terms/ holds both pages for every shorter range
# of Terms; conferences.yml re-renders only the two full-span pages nightly, so
# after a change to either renderer dispatch this to bring the ranges along.

on:
  workflow_dispatch:

permissions:
  contents: write

# Shares the conferences lane: conferences.yml also renders this page, and both
# write through publish_site.sh, so they must not race.
concurrency:
  group: conference-reports
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # Must exceed the sum of this job's step caps (currently 75: setup-r 30 +
    # setup-r-dependencies 15, twice, with a 15-minute settle between), or the
    # job dies first and the step caps never fire -- which is strictly worse,
    # because a job-level cancel does not say WHICH step hung, while a step
    # timeout names it. 90 = 75 + a 15 min work allowance, ~5x the measured
    # maximum for any of these light jobs -- plus 15 for the amicus page, whose
    # stale-stats recompute measured 13 minutes locally (2026-10-29) -- plus 60
    # for the Term-range pages' own step cap.
    timeout-minutes: 165
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v5
      - name: Checkout published site (gh-pages) into ./site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
      - uses: ./.github/actions/apt-sources
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 30
        with:
          use-public-rspm: true
      # Two attempts: a slow Ubuntu mirror (not a stalled one) outlasts the
      # 15-minute cap. See daily.yml.
      - name: Install R packages (cached)
        id: rdeps
        uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        timeout-minutes: 15
        with:
      # No pdftools -- this page resolves none. gt/gtExtras are not used by
      # the renderer (the tables are hand-built HTML) but R/cert_funnel.R
      # declares them at the top and counsel_table.R needs its classifier, so
      # they must be installed for the source() to succeed at all.
          packages: |
            any::tidyverse
            any::htmltools
            any::jsonlite
            any::digest
            any::gt
            any::gtExtras
      - name: Let the first attempt's apt finish
        if: steps.rdeps.outcome == 'failure'
        timeout-minutes: 15
        run: |
          while pgrep -x 'apt-get|apt|dpkg' >/dev/null; do sleep 10; done
          sudo dpkg --configure -a
      - name: Install R packages (second attempt)
        if: steps.rdeps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          # No pdftools -- this page resolves none. gt/gtExtras are not used by
          # the renderer (the tables are hand-built HTML) but R/cert_funnel.R
          # declares them at the top and counsel_table.R needs its classifier, so
          # they must be installed for the source() to succeed at all.
          packages: |
            any::tidyverse
            any::htmltools
            any::jsonlite
            any::digest
            any::gt
            any::gtExtras

      - name: Render the counsel table
        env:
          SITE_DIR: site
        run: Rscript .github/scripts/render_counsel.R

      - name: Render the amicus page
        env:
          SITE_DIR: site
        run: Rscript .github/scripts/render_amicus.R

      # Both pages again for every shorter range of Terms (R/term_range.R), from
      # the committed extractions: ~15 minutes, or ~40 if either is stale and
      # has to be re-extracted in-process.
      - name: Render the Term-range pages
        timeout-minutes: 60
        env:
          SITE_DIR: site
        run: Rscript .github/scripts/render_counsel_ranges.R

      - name: Publish
        working-directory: site
        run: ../.github/scripts/publish_site.sh "Counsel table re-render $(date -u +%F)" counsel/index.html counsel/amicus.html counsel/terms
